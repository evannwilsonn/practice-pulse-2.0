# dbt looks for this file in the project folder first.
# Local runs use DuckDB; set the env vars and use --target snowflake for Snowflake.
practice_pulse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse/practice_pulse.duckdb
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING') }}"
      database: PRACTICE_PULSE
      schema: ANALYTICS
      threads: 8
